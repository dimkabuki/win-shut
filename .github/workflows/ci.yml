name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ShutdownTimer.sln
      - name: Check formatting
        run: dotnet format ShutdownTimer.sln --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build ShutdownTimer.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test ShutdownTimer.sln --configuration Release --no-build --no-restore
