name: Build Windows executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish-win-x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single-file executable
        run: >-
          dotnet publish src/ShutdownTimer.App/ShutdownTimer.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/publish
      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShutdownTimer-win-x64
          path: artifacts/publish/ShutdownTimer.App.exe
          if-no-files-found: error
          retention-days: 7
